<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - SPN</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;padding:15px}.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none}input{background:#334155;color:#fff}button{background:#22c55e;font-weight:bold}</style></head><body>
<h1>SPN Admin</h1>
<div id="login" class="card"><input id="pwd" type="password" placeholder="Admin password"><button onclick="adminLogin()">Login</button><p id="msg"></p></div>
<div id="panel" style="display:none"><div class="card"><h3>Stats</h3><div id="stats"></div></div><div class="card"><h3>Users</h3><div id="users"></div></div><div class="card"><h3>Deposits</h3><div id="deps"></div></div><div class="card"><h3>Withdrawals</h3><div id="withs"></div></div></div>
<script>async function adminLogin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd.value})});let d=await r.json();if(d.success){login.style.display='none';panel.style.display='block';load();}else msg.innerText='Wrong';}
async function load(){let r=await fetch('/api/admin/data');let d=await r.json();stats.innerHTML=`Users: ${d.stats.totalUsers} | Deposits: ${d.stats.totalDeposits} KSH`;users.innerHTML=d.users.map(u=>`${u.phone} - ${u.balance} KSH`).join('<br>');deps.innerHTML=d.deposits.map(x=>`${x.phone} ${x.amount}`).join('<br>');withs.innerHTML=d.withdrawals.map(x=>`${x.phone} ${x.amount} fee ${x.fee}`).join('<br>');}
</script></body></html>
