<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN</title>
<style>body{margin:0;background:#060a14;color:#fff;font-family:sans-serif;min-height:100vh}.card{background:#0f1930;border-radius:20px;padding:20px;max-width:400px;margin:40px auto}input,select{width:100%;padding:16px;margin:8px 0;border-radius:12px;border:2px solid #1e2f5a;background:#060c1e;color:#fff}button{width:100%;padding:16px;border-radius:12px;border:none;font-weight:900;margin-top:10px}</style>
</head><body><div class="card">
<select id="cc"><option value="+254">Kenya +254</option></select>
<input id="ph" placeholder="791895658">
<input id="pw" type="password" placeholder="123456">
<button onclick="reg()" style="background:#2de2ff;color:#000">Create Account</button>
<button onclick="log()" style="background:#162244;color:#fff;margin-top:8px">Login</button>
</div>
<script>
function gp(){return document.getElementById('cc').value+document.getElementById('ph').value}
function reg(){localStorage.setItem('cur',gp());localStorage.setItem('b_'+gp(),'10000');location.href='trade.html'}
function log(){localStorage.setItem('cur',gp());location.href='trade.html'}
</script></body></html>
