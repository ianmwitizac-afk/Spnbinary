<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FX Pesa - Trade</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}body{background:#070b17;color:#fff;overflow:hidden;height:100vh;display:flex;flex-direction:column}.hdr{background:#0f1731;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d5a}.bal{background:#101c3a;border-radius:10px;padding:6px 10px;font-size:12px;text-align:right}.bal b{color:#ffcc00;font-size:14px}.depBtn{background:#ffcc00;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px}.tabs{display:flex;background:#0c1226;overflow-x:auto;white-space:nowrap}.tabs button{padding:12px 14px;background:transparent;border:none;color:#7e8ab0;font-weight:700;font-size:12px;border-bottom:2px solid transparent}.tabs button.active{color:#ffcc00;border-color:#ffcc00}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.list{overflow:auto;flex:1}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #141f3d}.item:active{background:#141f3d}.sym{font-weight:800}.name{font-size:10px;color:#7e8ab0}.chg{font-size:12px;padding:3px 8px;border-radius:20px}.up{background:#0d2a1e;color:#00e676}.down{background:#2a1212;color:#ff5252}.panel{background:#0f1731;border-top:1px solid #1e2d5a;padding:12px}.row{display:flex;gap:8px;margin:6px 0}input{flex:1;padding:12px;border-radius:10px;border:1px solid #22305a;background:#070c1e;color:#fff}.btn{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900}.buy{background:#00e676;color:#000}.sell{background:#ff5252;color:#fff}.footer{display:flex;background:#0c1226;border-top:1px solid #1e2d5a}.footer button{flex:1;padding:12px;background:transparent;border:none;color:#7e8ab0;font-size:11px;font-weight:700}.footer button.active{color:#ffcc00}.badge{background:#ffcc00;color:#000;border-radius:10px;padding:2px 6px;font-size:10px;margin-left:4px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99}.modalBox{background:#111b36;border-radius:20px;padding:20px;width:92%;max-width:380px;border:1px solid #1e2d5a}</style></head><body><div class="hdr"><div><b>FX<span style="color:#ffcc00">Pesa</span></b> <span style="font-size:10px;color:#7e8ab0" id="uPhone"></span></div><div style="display:flex;gap:8px;align-items:center"><div class="bal"><div>KSh <b id="bKES">0</b></div><div style="font-size:10px;color:#7e8ab0">$<span id="bUSD">0</span></div></div><button class="depBtn" onclick="openDep()">DEPOSIT</button></div></div><div class="tabs" id="catTabs"><button class="active" onclick="filterCat('forex')">FOREX</button><button onclick="filterCat('indices')">INDICES</button><button onclick="filterCat('commodities')">COMMODITIES</button><button onclick="filterCat('crypto')">CRYPTO</button><button onclick="filterCat('shares')">SHARES</button></div><div class="main"><div class="list" id="mList"></div><div class="panel"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span id="selSym">EUR/USD</span><span id="selPrice" style="color:#ffcc00">1.0845</span></div><div class="row"><input id="lot" value="0.01" type="number" step="0.01" placeholder="Lots"><input id="lev" value="1:400" readonly><input id="sl" placeholder="SL"><input id="tp" placeholder="TP"></div><div class="row"><button class="btn buy" onclick="place('BUY')">BUY</button><button class="btn sell" onclick="place('SELL')">SELL</button></div></div></div><div class="footer"><button class="active" onclick="showP('trade')">TRADE</button><button onclick="showP('positions')">POSITIONS <span class="badge" id="posCnt">0</span></button><button onclick="showP('history')">HISTORY</button><button onclick="logout()">EXIT</button></div><div class="modal" id="depModal"><div class="modalBox"><h3 style="margin-bottom:10px">Deposit via M-Pesa</h3><input id="depAmt" placeholder="Amount KES e.g 1000"><select id="depMethod"><option>M-Pesa</option><option>Airtel Money</option><option>Card</option><option>Bank</option></select><button class="btn buy" style="width:100%;margin-top:10px" onclick="doDep()">DEPOSIT NOW</button><div style="font-size:11px;color:#7e8ab0;margin-top:8px">Admin will approve in Admin Centre. Funds added to KES balance.</div><button onclick="closeDep()" style="width:100%;background:transparent;border:none;color:#7e8ab0;margin-top:10px">Close</button></div></div><script>let cur=localStorage.getItem('cur');if(!cur)location.href='index.html';document.getElementById('uPhone').innerText=cur;let markets={forex:[{s:'EUR/USD',n:'Euro Dollar',p:1.0845,c:'+0.24%'},{s:'GBP/USD',n:'Pound Dollar',p:1.2732,c:'-0.12%'},{s:'USD/JPY',n:'Dollar Yen',p:154.32,c:'+0.45%'},{s:'USD/KES',n:'Dollar Shilling',p:129.45,c:'+0.10%'},{s:'EUR/KES',n:'Euro Shilling',p:140.20,c:'-0.05%'}],indices:[{s:'US30',n:'Dow Jones',p:38745,c:'+0.85%'},{s:'NAS100',n:'Nasdaq',p:17890,c:'+1.2%'},{s:'GER40',n:'DAX',p:18200,c:'-0.3%'}],commodities:[{s:'XAU/USD',n:'Gold',p:2345.6,c:'+0.65%'},{s:'XAG/USD',n:'Silver',p:28.45,c:'-0.8%'},{s:'USOIL',n:'Oil',p:78.9,c:'+1.1%'}],crypto:[{s:'BTC/USD',n:'Bitcoin',p:67200,c:'+2.4%'},{s:'ETH/USD',n:'Ethereum',p:3450,c:'+1.8%'}],shares:[{s:'AAPL',n:'Apple',p:185.2,c:'+0.5%'},{s:'TSLA',n:'Tesla',p:245.6,c:'-1.2%'}]};let cat='forex';let selected={s:'EUR/USD',p:1.0845};function loadBal(){let u=JSON.parse(localStorage.getItem('user_'+cur)||'{}');document.getElementById('bKES').innerText=(u.balanceKES||0).toLocaleString();document.getElementById('bUSD').innerText=u.balanceUSD||0;}function render(){let list=document.getElementById('mList');list.innerHTML='';(markets[cat]||[]).forEach(m=>{let adminPrice=localStorage.getItem('price_'+m.s);if(adminPrice)m.p=parseFloat(adminPrice);let isUp=m.c.includes('+');let d=document.createElement('div');d.className='item';d.onclick=()=>{selected=m;document.getElementById('selSym').innerText=m.s;document.getElementById('selPrice').innerText=m.p;};d.innerHTML=`<div><div class="sym">${m.s}</div><div class="name">${m.n}</div></div><div style="text-align:right"><div style="font-weight:700">${m.p}</div><div class="chg ${isUp?'up':'down'}">${m.c}</div></div>`;list.appendChild(d);});}function filterCat(c){cat=c;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');render();}function showP(p){if(p=='positions'){let pos=JSON.parse(localStorage.getItem('positions_'+cur)||'[]');alert(pos.length+' Open Positions:\n'+pos.map(x=>x.sym+' '+x.type+' '+x.lot+' P/L '+(x.pl||0)).join('\n'));}if(p=='history'){let h=JSON.parse(localStorage.getItem('history_'+cur)||'[]');alert('History:\n'+h.slice(-10).map(x=>x).join('\n'));}}function place(type){let lot=parseFloat(document.getElementById('lot').value)||0.01;let u=JSON.parse(localStorage.getItem('user_'+cur));let cost=lot*1000;if((u.balanceKES||0)<cost){alert('Low KES balance, Deposit');return}u.balanceKES-=cost;localStorage.setItem('user_'+cur,JSON.stringify(u));loadBal();let pos=JSON.parse(localStorage.getItem('positions_'+cur)||'[]');pos.push({sym:selected.s,price:selected.p,type:type,lot:lot,time:Date.now(),pl:0});localStorage.setItem('positions_'+cur,JSON.stringify(pos));document.getElementById('posCnt').innerText=pos.length;let hist=JSON.parse(localStorage.getItem('history_'+cur)||'[]');hist.push(`${new Date().toLocaleTimeString()} ${type} ${selected.s} ${lot} lots @ ${selected.p}`);localStorage.setItem('history_'+cur,JSON.stringify(hist));alert(type+' placed: '+selected.s+' admin can control win/loss from admin.html');}function openDep(){document.getElementById('depModal').style.display='flex'}function closeDep(){document.getElementById('depModal').style.display='none'}function doDep(){let amt=parseFloat(document.getElementById('depAmt').value);if(!amt)return;let req=JSON.parse(localStorage.getItem('deposits')||'[]');req.push({phone:cur,amount:amt,method:document.getElementById('depMethod').value,time:Date.now(),status:'pending'});localStorage.setItem('deposits',JSON.stringify(req));alert('Deposit request KES '+amt+' sent. Admin will approve in admin.html -> then balance added.');closeDep();}function logout(){localStorage.removeItem('cur');location.href='index.html'}loadBal();render();setInterval(()=>{for(let k in markets){markets[k].forEach(m=>{let adminPrice=localStorage.getItem('price_'+m.s);if(!adminPrice){m.p=(parseFloat(m.p)*(1+(Math.random()-0.5)/500)).toFixed(m.s.includes('JPY')||m.s.includes('KES')?2:4);}else{m.p=parseFloat(adminPrice).toFixed(4)}})}document.getElementById('selPrice').innerText=selected.p;render();},2000);</script></body></html>
