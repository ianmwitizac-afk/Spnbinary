<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN Login FIXED</title><style>*{box-sizing:border-box}body{margin:0;background:#060a14;color:#fff;font-family:sans-serif;min-height:100vh}.h{padding:16px;background:#0a1020;border-bottom:1px solid #1a2a4a;display:flex;justify-content:space-between}.logo{font-weight:900;font-size:22px}.logo span{color:#2de2ff}.wrap{max-width:420px;margin:0 auto;padding:24px}.card{background:#0f1930;border:1px solid #1f315c;border-radius:20px;padding:24px}select,input{width:100%;padding:16px;margin:8px 0;border-radius:12px;border:2px solid #1e2f5a;background:#060c1e;color:#fff;font-size:16px}label{font-size:11px;color:#8aa0c0;display:block;margin-top:8px}.btn{width:100%;padding:16px;border-radius:12px;border:none;font-weight:900;font-size:16px;margin-top:12px}.g{background:linear-gradient(90deg,#2de2ff,#6a7bff);color:#000}.d{background:#162244;color:#fff;border:1px solid #243252}.msg{padding:12px;border-radius:10px;display:none;text-align:center;margin:10px 0}</style></head><body>
<div class="h"><div class="logo">SPN<span>BINARY</span></div><div style="color:#2de2ff;font-size:11px">FIXED LOGIN</div></div>
<div class="wrap"><h1 style="font-size:32px;font-weight:900;margin:20px 0 8px">Welcome Back</h1><p style="color:#8aa0c0">Fixed: auto removes extra 254/0</p><div class="card">
<div id="m" class="msg"></div>
<label>COUNTRY CODE</label><select id="cc"><option value="+254">🇰🇪 Kenya +254</option><option value="+255">🇹🇿 Tanzania +255</option><option value="+256">🇺🇬 Uganda +256</option><option value="+250">🇷🇼 Rwanda +250</option><option value="+27">🇿🇦 South Africa +27</option><option value="+234">🇳🇬 Nigeria +234</option><option value="+1">🇺🇸 USA +1</option><option value="+44">🇬🇧 UK +44</option></select>
<label>PHONE (type 791895658 ONLY - no 0, no 254)</label><input id="ph" type="number" placeholder="791895658">
<label>PASSWORD</label><input id="pw" type="password" placeholder="123456 min 6">
<button class="btn g" onclick="reg()">Create Account →</button><button class="btn d" onclick="log()">Login to Trading →</button>
<button onclick="clearAll()" style="margin-top:12px;width:100%;padding:10px;background:transparent;border:1px dashed #ff4258;color:#ff4258;border-radius:8px;font-size:11px">Clear all accounts if stuck (tap here)</button>
<p style="font-size:10px;color:#5a6e8f;text-align:center;margin-top:10px">Owner: +254791895658</p></div></div>
<script>
const OWNER="+254791895658";
function show(t,ok){let e=document.getElementById('m');e.textContent=t;e.style.background=ok?'#0a2e1a':'#2e0a0a';e.style.color=ok?'#4ade80':'#f87171';e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
function getPhone(){let cc=document.getElementById('cc').value;let ph=document.getElementById('ph').value.trim().toString().replace(/[^0-9]/g,'');ph=ph.replace(/^0+/,'');if(ph.startsWith('254'))ph=ph.substring(3);if(ph.startsWith('255'))ph=ph.substring(3);if(ph.startsWith('256'))ph=ph.substring(3);if(ph.startsWith('1')&&cc==='+1'&&ph.length>10)ph=ph.substring(1);if(ph.length<7)return null;return cc+ph}
function reg(){let full=getPhone();let pw=document.getElementById('pw').value.trim();if(!full){show('Enter 791895658 only',0);return}if(pw.length<6){show('Password 6+',0);return}let u=JSON.parse(localStorage.getItem('u')||'{}');u[full]=pw;localStorage.setItem('u',JSON.stringify(u));localStorage.setItem('cur',full);if(!localStorage.getItem('b_'+full))localStorage.setItem('b_'+full,'10000');show('Created '+full+'! Opening...',1);setTimeout(()=>location.href='trade.html',800)}
function log(){let full=getPhone();let pw=document.getElementById('pw').value.trim();if(!full){show('Enter phone',0);return}let u=JSON.parse(localStorage.getItem('u')||'{}');if(!u[full]){show('No account '+full+' - tap Create Account first',0);return}if(u[full]!=pw){show('Wrong password for '+full,0);return}localStorage.setItem('cur',full);show('Welcome '+full,1);setTimeout(()=>location.href=full===OWNER?'admin.html':'trade.html',700)}
function clearAll(){if(confirm('Clear all saved accounts on this phone?')){localStorage.clear();show('Cleared! Now create new account with 791895658',1);setTimeout(()=>location.reload(),1000)}}
</script></body></html>
