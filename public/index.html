<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN BINARY</title><style>body{margin:0;background:#060a14;color:#fff;font-family:sans-serif}.h{display:flex;justify-content:space-between;padding:14px;background:#0a1020;border-bottom:1px solid #1a2a4a}.logo{font-weight:900;font-size:22px}.logo span{color:#2de2ff}.card{max-width:360px;margin:20px auto;background:#0f1930;border:1px solid #1f315c;border-radius:16px;padding:20px}.card input{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:1px solid #1e2f5a;background:#060c1e;color:#fff;box-sizing:border-box}.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:900;cursor:pointer;margin-top:8px}.g{background:linear-gradient(90deg,#2de2ff,#6a7bff);color:#000}.d{background:#162244;color:#fff;border:1px solid #243252}#trade{display:none;height:100vh;flex-direction:column}.top{display:flex;justify-content:space-between;padding:10px;background:#0a1020;border-bottom:1px solid #1a2a4a}.main{display:flex;flex:1}.left{width:120px;background:#0a1020;border-right:1px solid #1a2a4a;overflow:auto}.asset{padding:8px;font-size:11px;border-bottom:1px solid #111;cursor:pointer}.asset.on{background:#111c36}.chart{flex:1;display:flex;flex-direction:column}.price{font-size:22px;font-weight:900;padding:8px}#tv{flex:1;background:#060a14;min-height:250px}.right{width:150px;background:#0a1020;border-left:1px solid #1a2a4a;padding:10px}.right input,.right select{width:100%;padding:10px;margin:4px 0;background:#060c1e;border:1px solid #1e2f5a;color:#fff;border-radius:8px;box-sizing:border-box}.buy{background:#00e676;color:#000;padding:14px;border-radius:10px;font-weight:900;border:none;width:100%;margin:4px 0}.sell{background:#ff4258;color:#fff;padding:14px;border-radius:10px;font-weight:900;border:none;width:100%;margin:4px 0}.msg{padding:8px;border-radius:8px;display:none;text-align:center;margin:6px 0;font-size:12px}</style><script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script></head><body><div id="landing"><div class="h"><div class="logo">SPN<span>BINARY</span></div><div style="color:#2de2ff;font-weight:800;font-size:11px">LIVE</div></div><div style="text-align:center;padding:30px 20px"><h1 style="font-size:32px;font-weight:900;margin:0">Trading Made Easy,<br>Trade <span style="color:#2de2ff">Smart.</span></h1><p style="color:#8aa0c0">100+ assets, 95% payout, M-Pesa</p></div><div class="card"><h3>Create free account</h3><p style="color:#8aa0c0;font-size:12px">$10,000 demo included</p><div id="m" class="msg"></div><input id="ph" placeholder="Phone 0712345678"><input id="pw" type="password" placeholder="Password 6+"><button class="btn g" onclick="reg()">Create Account →</button><button class="btn d" onclick="log()">Login to Trading</button></div></div><div id="trade"><div class="top"><div class="logo" style="font-size:14px">SPN<span>BINARY</span> LIVE</div><div><span id="bal" style="color:#00e676;font-weight:900">$10,000</span> <button onclick="location.reload()" style="margin-left:8px;background:#162244;color:#fff;border:1px solid #243252;border-radius:999px;padding:4px 10px">Logout</button></div></div><div class="main"><div class="left" id="alist"></div><div class="chart"><div class="price" id="pr">12543.21</div><div id="tv"></div><div style="padding:6px;font-size:10px;color:#6b7da0">Positions: <span id="pc">0</span> | <span id="timer"></span></div></div><div class="right"><label style="font-size:9px;color:#6b7da0">AMOUNT</label><input id="amt" type="number" value="50"><label style="font-size:9px;color:#6b7da0">EXPIRY</label><select id="exp"><option value="30">30s</option><option value="60">60s</option></select><div style="font-size:11px;margin:6px 0">Payout <b id="pay" style="color:#00e676">+$47.5</b></div><button class="buy" onclick="tr('buy')">▲ BUY</button><button class="sell" onclick="tr('sell')">▼ SELL</button><button onclick="alert('M-Pesa Paybill 123456 Acc SPN'+localStorage.getItem('cur'))" style="width:100%;padding:8px;background:#0f1930;border:1px solid #1f315c;color:#fff;border-radius:8px;margin-top:6px;font-size:11px">Deposit M-Pesa</button></div></div></div><script>
let assets=[{n:'V10',v:10,p:5423},{n:'V25',v:25,p:8345},{n:'V50',v:50,p:12345},{n:'V75',v:75,p:12543},{n:'V100',v:100,p:15678},{n:'EUR/USD',v:15,p:1.0845},{n:'BTC',v:90,p:43256}];let cur=assets[3],price=cur.p,candles=[],act=null,bal=10000,chart,srs;
function show(t,ok){let e=document.getElementById('m');e.textContent=t;e.style.background=ok?'#0a2e1a':'#2e0a0a';e.style.color=ok?'#4ade80':'#f87171';e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function reg(){let ph=document.getElementById('ph').value.trim(),pw=document.getElementById('pw').value.trim();if(ph.length<10){show('Enter phone 10 digits',0);return}if(pw.length<6){show('Password min 6',0);return}let u=JSON.parse(localStorage.getItem('u')||'{}');if(u[ph]){show('Exists, login',0);return}u[ph]=pw;localStorage.setItem('u',JSON.stringify(u));localStorage.setItem('cur',ph);localStorage.setItem('b_'+ph,'10000');show('Created! Opening...',1);setTimeout(openT,600)}
function log(){let ph=document.getElementById('ph').value.trim(),pw=document.getElementById('pw').value.trim();let u=JSON.parse(localStorage.getItem('u')||'{}');if(!u[ph]||u[ph]!=pw){show('Wrong phone/password',0);return}localStorage.setItem('cur',ph);show('Welcome!',1);setTimeout(openT,500)}
function openT(){document.getElementById('landing').style.display='none';document.getElementById('trade').style.display='flex';load();initA();initC()}
function load(){let c=localStorage.getItem('cur');bal=parseFloat(localStorage.getItem('b_'+c)||'10000');document.getElementById('bal').textContent='$'+bal.toFixed(2);calc()}
function calc(){let a=parseFloat(document.getElementById('amt').value||0);document.getElementById('pay').textContent='+$'+(a*0.95).toFixed(1)}
document.getElementById('amt').oninput=calc;
function initA(){let el=document.getElementById('alist');el.innerHTML='';assets.forEach((a,i)=>{let d=document.createElement('div');d.className='asset'+(i==3?' on':'');d.textContent=a.n+' '+a.p; d.onclick=()=>{document.querySelectorAll('.asset').forEach(x=>x.classList.remove('on'));d.classList.add('on');cur=a;price=a.p;candles=[];gen()};el.appendChild(d)})}
function initC(){let e=document.getElementById('tv');chart=LightweightCharts.createChart(e,{layout:{background:{color:'#060a14'},textColor:'#6b7da0'},grid:{vertLines:{color:'#0e1930'},horzLines:{color:'#0e1930'}},width:e.clientWidth,height:260});srs=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff4258',wickUpColor:'#00e676',wickDownColor:'#ff4258'});gen();setInterval(up,1000)}
function gen(){let t=Math.floor(Date.now()/1000)-200,p=cur.p;candles=[];for(let i=0;i<100;i++){let o=p,ch=(Math.random()-0.5)*cur.v*0.6,c=o+ch,h=Math.max(o,c)+Math.random()*cur.v*0.3,l=Math.min(o,c)-Math.random()*cur.v*0.3;candles.push({time:t+i,open:o,high:h,low:l,close:c});p=c}srs.setData(candles);price=p;document.getElementById('pr').textContent=price.toFixed(2)}
function up(){if(!candles.length)return;let last=candles[candles.length-1],nc=last.close+(Math.random()-0.5)*cur.v*0.4;let u={...last,close:nc,high:Math.max(last.high,nc),low:Math.min(last.low,nc)};candles[candles.length-1]=u;srs.update(u);price=nc;document.getElementById('pr').textContent=price.toFixed(2)}
function tr(dir){if(act){alert('Wait trade finish');return}let amt=parseFloat(document.getElementById('amt').value||0);if(bal<amt){alert('Low balance');return}let c=localStorage.getItem('cur');bal-=amt;localStorage.setItem('b_'+c,bal);load();act={dir,amt,entry:price};let sec=parseInt(document.getElementById('exp').value);let el=document.getElementById('timer');el.textContent='00:'+sec;let it=setInterval(()=>{sec--;el.textContent='00:'+(sec<10?'0':'')+sec;if(sec<=0){clearInterval(it);fin();}},1000);srs.setMarkers([{time:candles[candles.length-1].time,position:dir=='buy'?'belowBar':'aboveBar',color:dir=='buy'?'#00e676':'#ff4258',shape:dir=='buy'?'arrowUp':'arrowDown',text:dir.toUpperCase()}])}
function fin(){if(!act)return;let exit=price,win=(act.dir=='buy'&&exit>act.entry)||(act.dir=='sell'&&exit<act.entry);let c=localStorage.getItem('cur'),b=parseFloat(localStorage.getItem('b_'+c)||0),txt='';if(win){let pr=act.amt*1.95;b+=pr;txt='WIN +$'+(pr-act.amt).toFixed(2)}else txt='LOSS -$'+act.amt.toFixed(2);localStorage.setItem('b_'+c,b);bal=b;load();document.getElementById('pc').textContent=parseInt(document.getElementById('pc').textContent||0)+1;act=null;setTimeout(()=>alert(txt),100)}
</script></body></html>
