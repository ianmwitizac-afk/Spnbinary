<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN BINARY</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0e1a;color:#fff}.header{background:#121a2e;border-bottom:1px solid #1e2d50;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.logo{color:#00d4ff;font-weight:900;font-size:20px}.balance-box{background:#0f1730;border:1px solid #24365e;border-radius:20px;padding:6px 14px}.bal-val{font-weight:800;color:#00ff88}.main{padding:12px;max-width:500px;margin:0 auto}.chart-wrap{background:#121a2e;border:1px solid #1e2d50;border-radius:14px;height:300px;position:relative;overflow:hidden}.timer-box{position:absolute;top:10px;right:12px;background:#ff3b30;color:#fff;padding:6px 12px;border-radius:20px;font-weight:800;display:none}#chart{width:100%;height:100%}.controls{background:#121a2e;border:1px solid #1e2d50;border-radius:14px;padding:14px;margin-top:12px}#amount{width:90px;text-align:center;background:#0f1730;border:1px solid #24365e;border-radius:8px;padding:8px;color:#fff;font-weight:800}.btn{padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;width:100%}.btn-up{background:linear-gradient(135deg,#00d4ff,#0066ff);color:#fff}.btn-down{background:linear-gradient(135deg,#ff1744,#d50000);color:#fff}.auth-wrap{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.auth-card{background:#121a2e;border:1px solid #1e2d50;border-radius:16px;width:100%;max-width:400px;padding:30px 25px}.hidden{display:none!important}</style></head><body><div id="authPage" class="auth-wrap"><div class="auth-card"><h1 style="color:#00d4ff;text-align:center">SPN BINARY</h1><div id="msg" style="padding:10px;border-radius:8px;margin:15px 0;display:none;text-align:center"></div><label>Phone</label><input id="phone" style="width:100%;padding:14px;background:#0f1730;border:1px solid #24365e;border-radius:10px;color:#fff;margin:6px 0 14px"><label>Password</label><input type="password" id="password" style="width:100%;padding:14px;background:#0f1730;border:1px solid #24365e;border-radius:10px;color:#fff;margin:6px 0 14px"><button style="width:100%;padding:14px;background:linear-gradient(90deg,#00d4ff,#0066ff);border:none;border-radius:10px;color:#fff;font-weight:800" onclick="register()">REGISTER</button><button style="width:100%;padding:14px;background:#1a2744;border:1px solid #2a3c66;border-radius:10px;color:#fff;margin-top:10px" onclick="login()">LOGIN</button></div></div><div id="tradePage" class="hidden"><div class="header"><div class="logo">SPN BINARY</div><div class="balance-box"><div style="font-size:11px;color:#8899bb">Balance</div><div class="bal-val" id="balDisplay">$10,000.00</div></div></div><div class="main"><div class="chart-wrap"><canvas id="chart"></canvas><div style="position:absolute;top:10px;left:12px;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:8px;font-size:12px"><div style="font-weight:800">EUR/USD • OTC</div><div style="color:#00ff88" id="livePrice">1.08453</div></div><div class="timer-box" id="timerBox">00:30</div></div><div class="controls"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span>Amount</span><div><button onclick="changeAmt(-10)" style="width:32px;height:32px;border-radius:8px;background:#0f1730;border:1px solid #24365e;color:#fff">-</button><input id="amount" type="number" value="100"><button onclick="changeAmt(10)" style="width:32px;height:32px;border-radius:8px;background:#0f1730;border:1px solid #24365e;color:#fff">+</button></div></div><div style="text-align:center;color:#8899bb;font-size:12px;margin-bottom:14px">Payout: <span style="color:#00d4ff;font-weight:800" id="payout">+88%</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-up" onclick="placeTrade('up')">📈 UP</button><button class="btn btn-down" onclick="placeTrade('down')">📉 DOWN</button></div><div style="margin-top:15px"><div style="font-size:12px;color:#8899bb">History • <span onclick="logout()" style="color:#00d4ff;cursor:pointer">Logout</span></div><div id="histList" style="margin-top:8px"></div></div></div></div></div><script>function showMsg(t,c){var e=document.getElementById('msg');e.textContent=t;e.style.background=c=='success'?'#0a2e1a':'#2e0a0a';e.style.color=c=='success'?'#4ade80':'#f87171';e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function register(){var p=document.getElementById('phone').value.trim();var pw=document.getElementById('password').value.trim();if(p.length<10){showMsg('Enter valid phone','error');return}if(pw.length<6){showMsg('Password min 6','error');return}var u=JSON.parse(localStorage.getItem('spn_users')||'{}');if(u[p]){showMsg('Exists, Login','error');return}u[p]=pw;localStorage.setItem('spn_users',JSON.stringify(u));localStorage.setItem('spn_current',p);if(!localStorage.getItem('bal_'+p))localStorage.setItem('bal_'+p,'10000');showMsg('Registered!','success');setTimeout(()=>openTrade(p),700)}function login(){var p=document.getElementById('phone').value.trim();var pw=document.getElementById('password').value.trim();var u=JSON.parse(localStorage.getItem('spn_users')||'{}');if(!u[p]){showMsg('Not found','error');return}if(u[p]!=pw){showMsg('Wrong pass','error');return}localStorage.setItem('spn_current',p);if(!localStorage.getItem('bal_'+p))localStorage.setItem('bal_'+p,'10000');showMsg('Login ok!','success');setTimeout(()=>openTrade(p),600)}function openTrade(p){document.getElementById('authPage').classList.add('hidden');document.getElementById('tradePage').classList.remove('hidden');loadBalance();startChart();}function logout(){localStorage.removeItem('spn_current');document.getElementById('tradePage').classList.add('hidden');document.getElementById('authPage').classList.remove('hidden');}function loadBalance(){var cur=localStorage.getItem('spn_current');var b=parseFloat(localStorage.getItem('bal_'+cur)||'10000');document.getElementById('balDisplay').textContent='$'+b.toFixed(2);}function changeAmt(d){var i=document.getElementById('amount');var v=Math.max(10,parseInt(i.value||0)+d);i.value=v;}let price=1.0845,data=[],ctx,activeTrade=null;function startChart(){const canvas=document.getElementById('chart');ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;ctx.scale(2,2);}resize();for(let i=0;i<80;i++){price+=(Math.random()-0.5)*0.0002;data.push(price);}draw();setInterval(()=>{price+=(Math.random()-0.5)*0.0003;data.push(price);if(data.length>80)data.shift();document.getElementById('livePrice').textContent=price.toFixed(5);},200);}function draw(){requestAnimationFrame(draw);if(!ctx)return;const c=document.getElementById('chart');const W=c.offsetWidth,H=c.offsetHeight;ctx.clearRect(0,0,W,H);let min=Math.min(...data),max=Math.max(...data),range=max-min||0.001;ctx.beginPath();ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;data.forEach((p,i)=>{let y=H-((p-min)/range*H*0.7+H*0.15);if(i==0)ctx.moveTo(i/data.length*W,y);else ctx.lineTo(i/data.length*W,y);});ctx.stroke();}function placeTrade(dir){if(activeTrade){alert('Wait for trade to finish!');return;}let amt=parseInt(document.getElementById('amount').value||0);let cur=localStorage.getItem('spn_current');let bal=parseFloat(localStorage.getItem('bal_'+cur)||'10000');if(bal<amt){alert('No balance!');return;}bal-=amt;localStorage.setItem('bal_'+cur,bal.toString());loadBalance();activeTrade={dir:dir,amount:amt,entry:price};document.getElementById('timerBox').style.display='block';let secs=30;let int=setInterval(()=>{secs--;document.getElementById('timerBox').textContent='00:'+(secs<10?'0':'')+secs;if(secs<=0){clearInterval(int);finishTrade();}},1000);}function finishTrade(){if(!activeTrade)return;let exit=price;let win=false;if(activeTrade.dir=='up')win=exit>activeTrade.entry;else win=exit<activeTrade.entry;if(Math.random()>0.5)win=!win;let cur=localStorage.getItem('spn_current');let bal=parseFloat(localStorage.getItem('bal_'+cur)||'0');let text='';if(win){let profit=activeTrade.amount*1.88;bal+=profit;text='WIN +$'+(profit-activeTrade.amount).toFixed(2);}else{text='LOSS -$'+activeTrade.amount;}localStorage.setItem('bal_'+cur,bal.toString());loadBalance();document.getElementById('timerBox').style.display='none';let hist=document.getElementById('histList');let div=document.createElement('div');div.style.display='flex';div.style.justifyContent='space-between';div.style.padding='8px 0';div.style.borderBottom='1px solid #1e2d50';div.style.fontSize='13px';div.innerHTML=`<span>${activeTrade.dir.toUpperCase()} $${activeTrade.amount}</span><span style="color:${win?'#00ff88':'#ff1744'}">${text}</span>`;hist.prepend(div);activeTrade=null;alert(text);}</script></body></html>
