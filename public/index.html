<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN BINARY</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0e1a;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{background:#121a2e;border:1px solid #1e2d50;border-radius:16px;width:100%;max-width:400px;padding:30px 25px}.logo{text-align:center;margin-bottom:25px}.logo h1{color:#00d4ff;font-size:28px}input{width:100%;padding:14px;background:#0f1730;border:1px solid #24365e;border-radius:10px;color:#fff;margin-top:6px;margin-bottom:15px}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-bottom:12px}.btn-register{background:linear-gradient(90deg,#00d4ff,#0066ff);color:#fff}.btn-login{background:#1a2744;color:#fff;border:1px solid #2a3c66}.msg{padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;display:none}.success{background:#0a2e1a;color:#4ade80}.error{background:#2e0a0a;color:#f87171}.platform{display:none}</style></head><body><div class="container" id="authBox"><div class="logo"><h1>SPN BINARY</h1><p>Professional Trading</p></div><div id="msg" class="msg"></div><label>Phone</label><input id="phone" placeholder="+254 7XX XXX"><label>Password</label><input type="password" id="password" placeholder="min 6 chars"><button class="btn btn-register" onclick="register()">REGISTER</button><button class="btn btn-login" onclick="login()">LOGIN</button></div><div class="container platform" id="platformBox"><div class="logo"><h1>SPN BINARY</h1><p id="userInfo"></p></div><h2 style="text-align:center;margin:20px 0;color:#00ff88">$10,000 DEMO</h2><button class="btn btn-register" onclick="alert('Trade UP placed!')">📈 UP</button><button class="btn btn-login" style="background:#ff1744" onclick="alert('Trade DOWN placed!')">📉 DOWN</button><button class="btn btn-login" onclick="logout()">LOGOUT</button></div><script>function showMsg(t,c){var e=document.getElementById('msg');e.textContent=t;e.className='msg '+c;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function register(){var p=document.getElementById('phone').value.trim();var pw=document.getElementById('password').value.trim();if(p.length<10){showMsg('Enter valid phone','error');return}if(pw.length<6){showMsg('Password min 6','error');return}var u=JSON.parse(localStorage.getItem('spn_users')||'{}');if(u[p]){showMsg('Exists, Login','error');return}u[p]=pw;localStorage.setItem('spn_users',JSON.stringify(u));localStorage.setItem('spn_current',p);showMsg('Registered!','success');setTimeout(()=>openP(p),700)}function login(){var p=document.getElementById('phone').value.trim();var pw=document.getElementById('password').value.trim();var u=JSON.parse(localStorage.getItem('spn_users')||'{}');if(!u[p]){showMsg('Not found, Register','error');return}if(u[p]!=pw){showMsg('Wrong password','error');return}localStorage.setItem('spn_current',p);showMsg('Login ok!','success');setTimeout(()=>openP(p),600)}function openP(p){document.getElementById('authBox').style.display='none';document.getElementById('platformBox').style.display='block';document.getElementById('userInfo').textContent='Welcome: '+p}function logout(){localStorage.removeItem('spn_current');document.getElementById('platformBox').style.display='none';document.getElementById('authBox').style.display='block'}</script></body></html>
