<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN - Trading</title><style>body{margin:0;background:#060a14;color:#fff;font-family:sans-serif}.top{display:flex;justify-content:space-between;padding:10px;background:#0a1020;border-bottom:1px solid #1a2a4a}.logo{font-weight:900}.logo span{color:#2de2ff}.main{display:flex;height:calc(100vh - 50px)}.left{width:110px;background:#0a1020;border-right:1px solid #1a2a4a;overflow:auto}.asset{padding:10px;font-size:11px;border-bottom:1px solid #111;cursor:pointer}.asset.on{background:#111c36;color:#2de2ff}.chart{flex:1;display:flex;flex-direction:column}.price{font-size:22px;font-weight:900;padding:10px}#tv{flex:1;background:#060a14;min-height:300px}.right{width:160px;background:#0a1020;border-left:1px solid #1a2a4a;padding:10px}.right input,.right select{width:100%;padding:10px;margin:5px 0;background:#060c1e;border:1px solid #1e2f5a;color:#fff;border-radius:8px;box-sizing:border-box}.buy{background:#00e676;color:#000;padding:14px;border-radius:10px;font-weight:900;border:none;width:100%;margin:5px 0}.sell{background:#ff4258;color:#fff;padding:14px;border-radius:10px;font-weight:900;border:none;width:100%;margin:5px 0}</style><script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script></head><body>
<div class="top"><div class="logo">SPN<span>BINARY</span> <span id="userPhone" style="font-size:10px;color:#8aa0c0;margin-left:8px"></span></div><div><span id="bal" style="color:#00e676;font-weight:900">$0</span><button onclick="location.href='index.html'" style="margin-left:8px;background:#162244;color:#fff;border:1px solid #243252;border-radius:999px;padding:4px 10px;font-size:11px">Logout</button></div></div>
<div class="main"><div class="left" id="alist"></div><div class="chart"><div class="price" id="pr">0.00 <span id="timer" style="float:right;color:#2de2ff;font-size:12px"></span></div><div id="tv"></div></div><div class="right"><label style="font-size:9px;color:#6b7da0">AMOUNT ($)</label><input id="amt" type="number" value="50"><label style="font-size:9px;color:#6b7da0">EXPIRY</label><select id="exp"><option value="30">30 sec</option><option value="60">60 sec</option><option value="120">2 min</option></select><div style="font-size:11px;margin:8px 0">Payout <b id="pay" style="color:#00e676">+$47.50</b></div><button class="buy" onclick="tr('buy')">▲ BUY</button><button class="sell" onclick="tr('sell')">▼ SELL</button><button onclick="dep()" style="width:100%;padding:10px;margin-top:10px;background:#0f1930;border:1px solid #1f315c;color:#fff;border-radius:8px;font-size:11px">Deposit M-Pesa</button><button onclick="location.href='admin.html'" id="adminLink" style="display:none;width:100%;padding:8px;margin-top:6px;background:gold;color:#000;border:none;border-radius:8px;font-weight:900;font-size:10px">👑 Owner Panel</button></div></div>
<script>
const OWNER="+254791895658";let assets=[{n:'Volatility 10',v:10,p:5423},{n:'Volatility 25',v:25,p:8345},{n:'Volatility 50',v:50,p:12345},{n:'Volatility 75',v:75,p:12543},{n:'Volatility 100',v:100,p:15678},{n:'EUR/USD',v:15,p:1.0845},{n:'GBP/USD',v:14,p:1.2734},{n:'BTC/USD',v:90,p:43256},{n:'Gold',v:30,p:2034}];let cur=assets[3],price=cur.p,candles=[],act=null,bal=0,chart,srs;
let curPhone=localStorage.getItem('cur');if(!curPhone){location.href='index.html'}document.getElementById('userPhone').textContent=curPhone;if(curPhone===OWNER)document.getElementById('adminLink').style.display='block';
function load(){bal=parseFloat(localStorage.getItem('b_'+curPhone)||'10000');document.getElementById('bal').textContent='$'+bal.toFixed(2);calc()}function calc(){let a=parseFloat(document.getElementById('amt').value||0);document.getElementById('pay').textContent='+$'+(a*0.95).toFixed(2)}document.getElementById('amt').oninput=calc;load();
function initA(){let el=document.getElementById('alist');el.innerHTML='';assets.forEach((a,i)=>{let d=document.createElement('div');d.className='asset'+(i==3?' on':'');d.innerHTML=a.n+'<br><span style="color:#6b7da0">'+a.p+'</span>';d.onclick=()=>{document.querySelectorAll('.asset').forEach(x=>x.classList.remove('on'));d.classList.add('on');cur=a;price=a.p;candles=[];gen()};el.appendChild(d)})}
function initC(){let e=document.getElementById('tv');chart=LightweightCharts.createChart(e,{layout:{background:{color:'#060a14'},textColor:'#6b7da0'},grid:{vertLines:{color:'#0e1930'},horzLines:{color:'#0e1930'}},width:e.clientWidth,height:350});srs=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff4258'});gen();setInterval(up,1000)}
function gen(){let t=Math.floor(Date.now()/1000)-200,p=cur.p;candles=[];for(let i=0;i<120;i++){let o=p,ch=(Math.random()-0.5)*cur.v*0.6,c=o+ch,h=Math.max(o,c)+Math.random()*cur.v*0.3,l=Math.min(o,c)-Math.random()*cur.v*0.3;candles.push({time:t+i,open:o,high:h,low:l,close:c});p=c}srs.setData(candles);price=p;document.getElementById('pr').textContent=price.toFixed(2)}
function up(){if(!candles.length)return;let last=candles[candles.length-1],nc=last.close+(Math.random()-0.5)*cur.v*0.4;let u={...last,close:nc,high:Math.max(last.high,nc),low:Math.min(last.low,nc)};candles[candles.length-1]=u;srs.update(u);price=nc;document.getElementById('pr').textContent=price.toFixed(2)}
function tr(dir){if(act){alert('Wait trade finish');return}let amt=parseFloat(document.getElementById('amt').value||0);if(bal<amt){alert('Low balance');return}bal-=amt;localStorage.setItem('b_'+curPhone,bal);load();act={dir,amt,entry:price};let sec=parseInt(document.getElementById('exp').value);let el=document.getElementById('timer');el.textContent='00:'+sec;let it=setInterval(()=>{sec--;el.textContent='00:'+(sec<10?'0':'')+sec;if(sec<=0){clearInterval(it);fin();}},1000);srs.setMarkers([{time:candles[candles.length-1].time,position:dir=='buy'?'belowBar':'aboveBar',color:dir=='buy'?'#00e676':'#ff4258',shape:dir=='buy'?'arrowUp':'arrowDown',text:dir.toUpperCase()}])}
function fin(){if(!act)return;let exit=price,win=(act.dir=='buy'&&exit>act.entry)||(act.dir=='sell'&&exit<act.entry);let b=parseFloat(localStorage.getItem('b_'+curPhone)||0),txt='';if(win){let pr=act.amt*1.95;b+=pr;txt='WIN +$'+(pr-act.amt).toFixed(2)}else txt='LOSS -$'+act.amt.toFixed(2);localStorage.setItem('b_'+curPhone,b);load();act=null;setTimeout(()=>alert(txt),100)}
function dep(){let amt=prompt('Amount KES:','500');if(!amt)return;let b=parseFloat(localStorage.getItem('b_'+curPhone)||0)+parseFloat(amt)/130;localStorage.setItem('b_'+curPhone,b);load();alert('Added $'+(parseFloat(amt)/130).toFixed(2))}
initA();initC();
</script></body></html>
