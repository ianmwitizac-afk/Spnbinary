<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FX Pesa KE</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#0a0e1a;color:#fff;min-height:100vh}.top{padding:18px;display:flex;justify-content:space-between}.logo{font-weight:900;font-size:22px}.logo span{color:#ffcc00}.card{background:#11182e;border:1px solid #1e2a4a;border-radius:22px;padding:22px;margin:16px;max-width:420px;margin:16px auto}.tab{display:flex;background:#0c1226;border-radius:12px;padding:4px;margin-bottom:14px}.tab button{flex:1;padding:12px;border:none;border-radius:10px;background:transparent;color:#8a94b3;font-weight:700}.tab button.active{background:#1c2a52;color:#fff}input,select{width:100%;padding:16px;border-radius:12px;border:1.5px solid #22305a;background:#0a1125;color:#fff;font-size:16px;margin:7px 0}input:focus{border-color:#ffcc00}.btn{width:100%;padding:17px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}.btn-y{background:#ffcc00;color:#000}.btn-d{background:#1c2a52;color:#fff}.small{font-size:12px;color:#8a94b3;text-align:center;margin-top:12px}.kes{color:#2de2ff;font-weight:800}</style></head><body><div class="top"><div class="logo">FX<span>Pesa</span> KE</div><div style="font-size:12px;color:#8a94b3">CMA License 107</div></div><div class="card"><div class="tab"><button id="tLive" class="active" onclick="setAcc('live')">LIVE</button><button id="tDemo" onclick="setAcc('demo')">DEMO</button></div><div style="display:flex;gap:8px"><select id="cc" style="width:35%"><option value="+254">🇰🇪 +254</option><option value="+255">🇹🇿 +255</option><option value="+256">🇺🇬 +256</option></select><input id="ph" style="width:65%" placeholder="7XX XXX XXX"></div><input id="pw" type="password" placeholder="Password"><div style="display:flex;gap:8px;margin-top:4px"><button class="btn btn-y" onclick="auth('login')" style="flex:1">LOGIN</button><button class="btn btn-d" onclick="auth('reg')" style="flex:1">CREATE</button></div><div class="small">Balance will be in <span class="kes">KES</span> • Instant M-Pesa • Leverage 1:400<br><a href="admin.html" style="color:#ffcc00;text-decoration:none">Admin Centre →</a></div><div id="msg" class="small" style="color:#ff6b6b"></div></div><script>let acc='live';function setAcc(v){acc=v;document.getElementById('tLive').className=v=='live'?'active':'';document.getElementById('tDemo').className=v=='demo'?'active':''}function auth(type){let phone=document.getElementById('ph').value.trim();let cc=document.getElementById('cc').value;let pw=document.getElementById('pw').value;if(phone.length<9){document.getElementById('msg').innerText='Enter valid phone';return}let full=cc+phone;let key='user_'+full;if(type=='reg'){if(localStorage.getItem(key)){document.getElementById('msg').innerText='Account exists, login';return}localStorage.setItem(key,JSON.stringify({phone:full,pw:pw,balanceKES:10000,balanceUSD:80,type:acc,created:Date.now()}));localStorage.setItem('cur',full);location.href='trade.html';}else{let u=localStorage.getItem(key);if(!u){document.getElementById('msg').innerText='No account, create first';return}localStorage.setItem('cur',full);location.href='trade.html';}}</script></body></html>
