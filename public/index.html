<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPN - Login</title><style>*{box-sizing:border-box}body{margin:0;background:#060a14;color:#fff;font-family:sans-serif;min-height:100vh}.h{padding:16px;background:#0a1020;border-bottom:1px solid #1a2a4a;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px}.logo span{color:#2de2ff}.wrap{max-width:420px;margin:0 auto;padding:24px}.card{background:#0f1930;border:1px solid #1f315c;border-radius:20px;padding:24px;margin-top:20px}select,input{width:100%;padding:16px;margin:8px 0;border-radius:12px;border:2px solid #1e2f5a;background:#060c1e;color:#fff;font-size:16px}label{font-size:11px;color:#8aa0c0;margin-top:10px;display:block}.btn{width:100%;padding:16px;border-radius:12px;border:none;font-weight:900;font-size:16px;margin-top:12px;cursor:pointer}.g{background:linear-gradient(90deg,#2de2ff,#6a7bff);color:#000}.d{background:#162244;color:#fff;border:1px solid #243252}.msg{padding:12px;border-radius:10px;display:none;text-align:center;margin:10px 0}</style></head><body>
<div class="h"><div class="logo">SPN<span>BINARY</span></div><div style="color:#2de2ff;font-size:11px">SECURE LOGIN</div></div>
<div class="wrap">
<h1 style="font-size:32px;font-weight:900;margin:20px 0 8px">Welcome Back</h1>
<p style="color:#8aa0c0;margin:0 0 20px">Login with country code. Numbers saved as +254...</p>
<div class="card">
<div id="m" class="msg"></div>
<label>COUNTRY CODE LIST</label>
<select id="cc">
<option value="+254">🇰🇪 Kenya +254</option>
<option value="+255">🇹🇿 Tanzania +255</option>
<option value="+256">🇺🇬 Uganda +256</option>
<option value="+250">🇷🇼 Rwanda +250</option>
<option value="+257">🇧🇮 Burundi +257</option>
<option value="+251">🇪🇹 Ethiopia +251</option>
<option value="+27">🇿🇦 South Africa +27</option>
<option value="+234">🇳🇬 Nigeria +234</option>
<option value="+233">🇬🇭 Ghana +233</option>
<option value="+212">🇲🇦 Morocco +212</option>
<option value="+20">🇪🇬 Egypt +20</option>
<option value="+1">🇺🇸 USA +1</option>
<option value="+44">🇬🇧 UK +44</option>
<option value="+91">🇮🇳 India +91</option>
<option value="+971">🇦🇪 UAE +971</option>
<option value="+966">🇸🇦 Saudi +966</option>
</select>
<label>PHONE NUMBER (without 0, e.g 791895658)</label>
<input id="ph" type="number" placeholder="791895658">
<label>PASSWORD</label>
<input id="pw" type="password" placeholder="Minimum 6 characters">
<button class="btn g" onclick="reg()">Create Account →</button>
<button class="btn d" onclick="log()">Login to Trading →</button>
<p style="font-size:10px;color:#5a6e8f;text-align:center;margin-top:16px">Owner only: +254791895658 | All phones start with + country code</p>
</div>
</div>
<script>
const OWNER="+254791895658";
function show(t,ok){let e=document.getElementById('m');e.textContent=t;e.style.background=ok?'#0a2e1a':'#2e0a0a';e.style.color=ok?'#4ade80':'#f87171';e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function getPhone(){let cc=document.getElementById('cc').value;let ph=document.getElementById('ph').value.trim().replace(/^0+/,'');if(ph.length<7)return null;return cc+ph}
function reg(){let full=getPhone();let pw=document.getElementById('pw').value.trim();if(!full){show('Enter phone without 0',0);return}if(pw.length<6){show('Password min 6',0);return}let u=JSON.parse(localStorage.getItem('u')||'{}');if(u[full]){show('Exists, login',0);return}u[full]=pw;localStorage.setItem('u',JSON.stringify(u));localStorage.setItem('cur',full);localStorage.setItem('b_'+full,'10000');show('Created '+full,1);setTimeout(()=>location.href='trade.html',800)}
function log(){let full=getPhone();let pw=document.getElementById('pw').value.trim();if(!full){show('Enter phone',0);return}let u=JSON.parse(localStorage.getItem('u')||'{}');if(!u[full]||u[full]!=pw){show('Wrong - check country code + phone',0);return}localStorage.setItem('cur',full);show('Welcome '+full,1);setTimeout(()=>location.href=full===OWNER?'admin.html':'trade.html',700)}
</script></body></html>
